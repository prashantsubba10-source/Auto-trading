.
name: CoinDCX Paper Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  paper-trading:
    runs-on: ubuntu-latest

    steps:
      - name: Get bot code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run paper trading bot
        run: python bot.py

      - name: Save trading balance
        run: |
          git config user.name "CoinDCX Bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (
            git commit -m "Update paper trading state"
            git push
          )
